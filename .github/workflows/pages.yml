# Gate, build and publish the live page. Nothing deploys unless both jobs pass:
# `build` runs the command's own gates (typecheck, tests, source, licence,
# vendor, calibration, measurements, claims) before it builds the page, and
# `verify` drives the built page in a browser and holds it to evalbar run in
# Node. The jobs that run install scripts hold no deployment permission:
# `pages: write` and `id-token: write` are on the deploy job alone.
#
# Node is pinned to the version the measurements were made on, because
# check:measure reruns them and compares their output byte for byte.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            page/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm ci
        working-directory: page
      - run: npm run build
        working-directory: page
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: page/dist

  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            page/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: page
      - run: npx playwright install --with-deps chromium
        working-directory: page
      - run: npm run build
        working-directory: page
      - run: npm run verify
        working-directory: page

  deploy:
    needs: [build, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
